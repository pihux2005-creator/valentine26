<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Be My Valentine 💘</title>

  <style>
    body {
      margin: 0;
      height: 100vh;
      background: radial-gradient(circle at top, #ffb6c1, #ff4d6d);
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: "Segoe UI", sans-serif;
      overflow: hidden;
    }

    /* Floating hearts */
    .heart {
      position: fixed;
      color: rgba(255, 255, 255, 0.7);
      font-size: 18px;
      animation: float 6s linear infinite;
    }

    @keyframes float {
      0% {
        transform: translateY(100vh) scale(1);
        opacity: 1;
      }
      100% {
        transform: translateY(-10vh) scale(1.5);
        opacity: 0;
      }
    }

    .card {
      background: white;
      padding: 40px;
      border-radius: 25px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.25);
      animation: pop 1s ease;
      position: relative;
      z-index: 10;
    }

    @keyframes pop {
      0% { transform: scale(0.7); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    h1 {
      color: #ff2e63;
      margin-bottom: 10px;
    }

    h2 {
      color: #ff5f7e;
      margin-bottom: 25px;
    }

    p {
      color: #555;
      font-size: 15px;
    }

    button {
      padding: 12px 28px;
      font-size: 16px;
      border-radius: 30px;
      border: none;
      cursor: pointer;
      margin: 10px;
      transition: 0.2s;
    }

    .yes {
      background: #ff2e63;
      color: white;
    }

    .yes:hover {
      transform: scale(1.1);
      background: #ff1744;
    }

    .no {
      background: #ffc1cc;
      color: #333;
      position: absolute;
    }

    .message {
      display: none;
      font-size: 22px;
      color: #ff2e63;
      margin-top: 20px;
    }
  </style>
</head>

<body>

  <!-- Hearts -->
  <script>
    for (let i = 0; i < 25; i++) {
      let heart = document.createElement("div");
      heart.className = "heart";
      heart.innerHTML = "💖";
      heart.style.left = Math.random() * 100 + "vw";
      heart.style.animationDuration = 3 + Math.random() * 4 + "s";
      heart.style.fontSize = 14 + Math.random() * 20 + "px";
      document.body.appendChild(heart);
    }
  </script>

  <div class="card">
    <h1>Hey You 💕</h1>
    <p>Life is sweeter with you in it</p>
    <h2>Will you be my Valentine? 💘</h2>

    <button class="yes" onclick="yesClicked()">Yes 💖</button>
    <button class="no" id="noBtn" onmouseover="moveNo()">No 🙈</button>

    <div class="message" id="message">
      YAYYYY!!! 💞💞💞  
      You just made my heart very happy 🥰
    </div>
  </div>

  <script>
    function moveNo() {
      const btn = document.getElementById("noBtn");
      const x = Math.random() * (window.innerWidth - 100);
      const y = Math.random() * (window.innerHeight - 100);
      btn.style.left = x + "px";
      btn.style.top = y + "px";
    }

    function yesClicked() {
      document.querySelector(".message").style.display = "block";
    }
  </script>

</body>
</html>
